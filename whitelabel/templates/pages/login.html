<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXO 4 ERP - Lal Khan Oil Mills Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
    rel="stylesheet">

  <style>
    /* ================================ */
    /*        RESET & BASE STYLES       */
    /* ================================ */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      background: #fff;
      color: #fff;
    }

    a {
      text-decoration: none;
    }

    /* ================================ */
    /*         KEYFRAME ANIMATIONS      */
    /* ================================ */
    @keyframes sway {

      0%,
      100% {
        transform: rotate(15deg) scale(1.1);
        opacity: 0.4;
      }

      50% {
        transform: rotate(25deg) scale(1);
        opacity: 1;
      }
    }

    @keyframes sway-reverse {

      0%,
      100% {
        transform: rotate(35deg) scale(1);
        opacity: 0.9;
      }

      50% {
        transform: rotate(25deg) scale(1.1);
        opacity: 0.3;
      }
    }

    @keyframes sway-slow {

      0%,
      100% {
        transform: rotate(45deg) scale(1.05);
        opacity: 0.3;
      }

      50% {
        transform: rotate(50deg) scale(1);
        opacity: 0.8;
      }
    }

    @keyframes float-droplet {

      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-30px) scale(1.05);
      }
    }

    @keyframes text-shimmer {
      0% {
        background-position: 0% center;
      }

      100% {
        background-position: -200% center;
      }
    }

    @keyframes drop-oil {
      0% {
        transform: translateY(-20px) scaleY(1.2) scaleX(0.8);
        opacity: 0;
      }

      20% {
        opacity: 1;
        transform: translateY(-10px) scaleY(1.1) scaleX(0.9);
      }

      60% {
        transform: translateY(0px) scale(1);
        opacity: 1;
      }

      80% {
        transform: translateY(5px) scaleY(0.9) scaleX(1.1);
        opacity: 0.8;
      }

      100% {
        transform: translateY(15px) scaleY(0.5) scaleX(1.5);
        opacity: 0;
      }
    }

    @keyframes seed-fall {
      0% {
        transform: translateY(-30px);
        opacity: 0;
      }

      15% {
        transform: translateY(0);
        opacity: 1;
      }

      20% {
        transform: translateY(-4px);
        opacity: 1;
      }

      25% {
        transform: translateY(0);
        opacity: 1;
      }

      85% {
        transform: translateY(0);
        opacity: 1;
      }

      100% {
        transform: translateY(0);
        opacity: 0;
      }
    }

    @keyframes slideUpFade {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ================================ */
    /*          MAIN LAYOUT             */
    /* ================================ */
    .login-wrapper {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* ================================ */
    /*        LEFT VISUAL PANE          */
    /* ================================ */
    .left-pane {
      display: none;
      width: 50%;
      position: relative;
      background: #18181b;
      overflow: hidden;
    }

    .left-pane .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.5;
    }

    /* Sun ray overlays */
    .sun-ray {
      position: absolute;
      top: -20%;
      right: -20%;
      width: 150%;
      height: 150%;
      background: linear-gradient(to bottom left, rgba(255, 230, 150, 0.25) 0%, transparent 60%);
      transform-origin: top right;
      pointer-events: none;
      filter: blur(40px);
    }

    .sun-ray-1 {
      animation: sway 14s ease-in-out infinite;
    }

    .sun-ray-2 {
      right: -10%;
      background: linear-gradient(to bottom left, rgba(255, 210, 100, 0.2) 0%, transparent 70%);
      animation: sway-reverse 17s ease-in-out infinite;
    }

    .sun-ray-3 {
      right: 10%;
      background: linear-gradient(to bottom left, rgba(255, 240, 180, 0.15) 0%, transparent 50%);
      animation: sway-slow 22s ease-in-out infinite;
    }

    /* Dark gradient overlay from bottom */
    .left-pane .gradient-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, #18181b 0%, rgba(24, 24, 27, 0.4) 40%, transparent 100%);
    }

    /* Left pane content */
    .left-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px;
      width: 100%;
      height: 100%;
    }

    .left-logo img {
      width: 180px;
      height: 180px;
      object-fit: contain;
      filter: drop-shadow(0 25px 25px rgba(0, 0, 0, 0.3));
    }

    /* Tagline */
    .tagline {
      font-family: "Playfair Display", ui-serif, Georgia, serif;
      font-size: 3rem;
      line-height: 1.2;
      margin-bottom: 40px;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
    }

    .tagline-line {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }

    .shimmer-text {
      background: linear-gradient(to right, #E5B05C, #ffffff, #E5B05C);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: text-shimmer 2s linear infinite;
    }

    /* Seeds SVG animation */
    .seeds-icon {
      margin-left: 12px;
    }

    .seeds-icon g {
      animation: seed-fall 4s ease-in-out infinite;
    }

    /* Oil droplet icon */
    .oil-drop-icon {
      margin-left: 12px;
      color: #fef08a;
      filter: drop-shadow(0 0 8px rgba(254, 240, 138, 0.6));
      animation: drop-oil 2s ease-in infinite;
    }

    /* Feature cards */
    .feature-cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 420px;
    }

    .feature-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      cursor: pointer;
      transition: all 0.3s ease;
      opacity: 0;
      animation: slideUpFade 0.8s ease-out forwards;
    }

    .feature-card:nth-child(1) {
      animation-delay: 0.2s;
    }

    .feature-card:nth-child(2) {
      animation-delay: 0.4s;
    }

    .feature-card:nth-child(3) {
      animation-delay: 0.6s;
    }

    .feature-card:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 40px -10px rgba(229, 176, 92, 0.1);
      transform: translateY(-2px) scale(1.02);
    }

    .feature-card:active {
      transform: scale(0.95);
    }

    .feature-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(229, 176, 92, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #E5B05C;
      flex-shrink: 0;
      transition: transform 0.3s;
    }

    .feature-card:hover .feature-icon {
      transform: scale(1.1);
    }

    .feature-icon svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .feature-text {
      font-size: 1.1rem;
      font-weight: 500;
      color: #fff;
    }

    /* ================================ */
    /*        RIGHT LOGIN PANE          */
    /* ================================ */
    .right-pane {
      width: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      background: rgba(17, 42, 42, 0.95);
      min-height: 100vh;
      overflow: hidden;
    }

    /* Mobile background image */
    .mobile-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .mobile-bg img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.3;
      mix-blend-mode: overlay;
    }

    .mobile-bg .mobile-bg-overlay {
      position: absolute;
      inset: 0;
      background: rgba(17, 42, 42, 0.8);
      backdrop-filter: blur(2px);
    }

    /* Decorative oil droplets */
    .decorative-droplets {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .decor-drop {
      position: absolute;
      color: #E5B05C;
      fill: currentColor;
    }

    .decor-drop-1 {
      top: 15%;
      left: 10%;
      width: 64px;
      height: 64px;
      filter: blur(2px);
      opacity: 0.2;
      animation: float-droplet 8s infinite ease-in-out;
    }

    .decor-drop-2 {
      bottom: 25%;
      right: 10%;
      width: 96px;
      height: 96px;
      filter: blur(4px);
      opacity: 0.1;
      animation: float-droplet 12s infinite ease-in-out 2s;
    }

    .decor-drop-3 {
      top: 45%;
      right: 15%;
      width: 40px;
      height: 40px;
      filter: blur(1px);
      opacity: 0.3;
      animation: float-droplet 10s infinite ease-in-out 4s;
    }

    .decor-drop-4 {
      bottom: 15%;
      left: 20%;
      width: 80px;
      height: 80px;
      filter: blur(3px);
      opacity: 0.15;
      animation: float-droplet 14s infinite ease-in-out 1s;
    }

    /* Interactive particles canvas */
    .particle-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      filter: blur(1px);
    }

    /* Form area */
    .form-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 32px 24px;
      position: relative;
      z-index: 10;
      width: 100%;
    }

    .form-container {
      width: 100%;
      max-width: 420px;
      animation: fadeInUp 0.8s ease-out;
    }

    /* Mobile logo  */
    .mobile-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 40px;
    }

    .mobile-logo img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.3));
    }

    /* Headings */
    .form-heading {
      font-size: 1.875rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.025em;
      margin-bottom: 12px;
    }

    .form-subheading {
      color: rgba(204, 234, 227, 0.7);
      font-size: 1rem;
      margin-bottom: 40px;
    }

    /* Error / Success messages */
    #login-message {
      display: none;
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      text-align: center;
    }

    /* Input groups */
    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: rgba(240, 253, 250, 0.9);
      margin-bottom: 8px;
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .forgot-link {
      font-size: 0.875rem;
      font-weight: 500;
      color: #E5B05C;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: #d4a04c;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(204, 234, 227, 0.4);
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .input-icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .input-field {
      width: 100%;
      padding: 14px 16px 14px 44px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }

    .input-field::placeholder {
      color: rgba(204, 234, 227, 0.4);
    }

    .input-field:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: #E5B05C;
      box-shadow: 0 0 0 3px rgba(229, 176, 92, 0.2);
    }

    .input-field:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .password-input {
      padding-right: 44px;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(204, 234, 227, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 0;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: rgba(204, 234, 227, 1);
    }

    .toggle-password svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Submit button */
    .submit-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 16px;
      background: #E5B05C;
      color: #112A2A;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 10px 30px -5px rgba(229, 176, 92, 0.2);
      margin-top: 8px;
    }

    .submit-btn:hover {
      background: #d4a04c;
    }

    .submit-btn:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(229, 176, 92, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.8;
      cursor: not-allowed;
    }

    .submit-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Spinner */
    .spinner {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* Footer branding */
    .branding-footer {
      position: relative;
      z-index: 10;
      padding: 24px 0 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: auto;
    }

    .powered-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.875rem;
      color: rgba(204, 234, 227, 0.4);
    }

    .nexo-logo svg {
      height: 24px;
      color: #fff;
    }

    .licensed-text {
      font-size: 0.75rem;
      background: linear-gradient(to right, rgba(229, 176, 92, 0.7), #fef08a, rgba(229, 176, 92, 0.7));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: text-shimmer 3s linear infinite;
    }

    /* ================================ */
    /*        RESPONSIVE (DESKTOP)      */
    /* ================================ */
    @media (min-width: 1024px) {
      .left-pane {
        display: flex;
      }

      .right-pane {
        width: 50%;
        background: #112A2A;
      }

      .mobile-bg {
        display: none;
      }

      .mobile-logo {
        display: none;
      }

      .form-area {
        padding: 48px 96px;
      }
    }

    @media (min-width: 1280px) {
      .tagline {
        font-size: 3.2rem;
      }
    }

    /* Small screens */
    @media (max-width: 480px) {
      .form-area {
        padding: 24px 20px;
      }

      .form-heading {
        font-size: 1.5rem;
      }

      .mobile-logo img {
        width: 100px;
        height: 100px;
      }
    }
  </style>
</head>

<body>
  <div class="login-wrapper">

    <!-- ======================== -->
    <!--     LEFT VISUAL PANE     -->
    <!-- ======================== -->
    <div class="left-pane">
      <!-- Background Image -->
      <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&q=80"
        alt="Golden agriculture field" class="bg-image" />

      <!-- Animated Sun Rays -->
      <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none;mix-blend-mode:screen;">
        <div class="sun-ray sun-ray-1"></div>
        <div class="sun-ray sun-ray-2"></div>
        <div class="sun-ray sun-ray-3"></div>
      </div>

      <!-- Dark gradient overlay -->
      <div class="gradient-overlay"></div>

      <!-- Left content -->
      <div class="left-content">
        <!-- Logo -->
        <div class="left-logo">
          <img src="/assets/whitelabel/images/lalkhan_logo.png" alt="Lal Khan Oil Mills Logo" />
        </div>

        <!-- Tagline + Feature Cards -->
        <div style="max-width: 540px; margin-bottom: 32px;">
          <h1 class="tagline">
            <div class="tagline-line">
              <span class="shimmer-text">From Seeds</span>
              <!-- Animated Seeds SVG -->
              <span class="seeds-icon">
                <svg viewBox="0 0 32 32" width="40" height="40" fill="none" xmlns="http://www.w3.org/2000/svg"
                  style="overflow:visible;">
                  <g style="animation: seed-fall 4s ease-in-out infinite 0s;">
                    <circle cx="8" cy="24" r="2.5" fill="#d4a04c" />
                    <circle cx="7.5" cy="23.5" r="0.5" fill="#fef08a" />
                  </g>
                  <g style="animation: seed-fall 4s ease-in-out infinite 0.5s;">
                    <circle cx="14" cy="26" r="3" fill="#E5B05C" />
                    <circle cx="13.5" cy="25.5" r="0.75" fill="#fef08a" />
                  </g>
                  <g style="animation: seed-fall 4s ease-in-out infinite 1s;">
                    <circle cx="20" cy="23" r="2" fill="#b48030" />
                    <circle cx="19.5" cy="22.5" r="0.5" fill="#fef08a" />
                  </g>
                  <g style="animation: seed-fall 4s ease-in-out infinite 1.5s;">
                    <circle cx="10" cy="28" r="2.2" fill="#d4a04c" />
                    <circle cx="9.5" cy="27.5" r="0.5" fill="#fef08a" />
                  </g>
                  <g style="animation: seed-fall 4s ease-in-out infinite 0.8s;">
                    <circle cx="24" cy="27" r="2.8" fill="#E5B05C" />
                    <circle cx="23.5" cy="26.5" r="0.6" fill="#fef08a" />
                  </g>
                  <g style="animation: seed-fall 4s ease-in-out infinite 2s;">
                    <circle cx="17" cy="28" r="2.5" fill="#b48030" />
                    <circle cx="16.5" cy="27.5" r="0.5" fill="#fef08a" />
                  </g>
                  <g style="animation: seed-fall 4s ease-in-out infinite 0.3s;">
                    <circle cx="28" cy="25" r="2" fill="#d4a04c" />
                    <circle cx="27.5" cy="24.5" r="0.4" fill="#fef08a" />
                  </g>
                  <g style="animation: seed-fall 4s ease-in-out infinite 1.2s;">
                    <circle cx="4" cy="26" r="2.3" fill="#E5B05C" />
                    <circle cx="3.5" cy="25.5" r="0.5" fill="#fef08a" />
                  </g>
                </svg>
              </span>
            </div>
            <div class="tagline-line">
              <span class="shimmer-text">To Refined Oil</span>
              <!-- Oil Droplet Icon -->
              <span class="oil-drop-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor"
                  stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                </svg>
              </span>
            </div>
          </h1>

          <!-- Feature Cards -->
          <div class="feature-cards">
            <!-- Card 1: Manage inventory -->
            <div class="feature-card">
              <div class="feature-icon">
                <svg viewBox="0 0 24 24">
                  <path
                    d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z">
                  </path>
                  <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                  <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
              </div>
              <span class="feature-text">Manage inventory</span>
            </div>

            <!-- Card 2: Oversee production lines -->
            <div class="feature-card">
              <div class="feature-icon">
                <svg viewBox="0 0 24 24">
                  <path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path>
                </svg>
              </div>
              <span class="feature-text">Oversee production lines</span>
            </div>

            <!-- Card 3: Track distribution -->
            <div class="feature-card">
              <div class="feature-icon">
                <svg viewBox="0 0 24 24">
                  <path d="M1 3h15v13H1z"></path>

  <!-- ================================ -->
  <!--    INTERACTIVE PARTICLES (JS)    -->
  <!-- ================================ -->
  <script>
    (function () {
      const canvas = document.getElementById('particleCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      let particles = [];
      let mouse = { x: -1000, y: -1000 };
      let animationFrameId;

      function resize() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        initParticles();
      }

      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 3 + 1;
          this.density = (Math.random() * 20) + 5;
          this.speedY = Math.random() * -0.5 - 0.2;
          this.speedX = Math.random() * 0.4 - 0.2;
          this.opacity = Math.random() * 0.5 + 0.1;
        }

        update() {
          this.y += this.speedY;
          this.x += this.speedX;

          if (this.y < -10) {
            this.y = canvas.height + 10;
            this.x = Math.random() * canvas.width;
          }
          if (this.x < -10) this.x = canvas.width + 10;
          if (this.x > canvas.width + 10) this.x = -10;

          let dx = mouse.x - this.x;
          let dy = mouse.y - this.y;
          let distance = Math.sqrt(dx * dx + dy * dy);
          let maxDistance = 120;
          if (distance < maxDistance) {
            let force = (maxDistance - distance) / maxDistance;
            let dirX = (dx / distance) * force * this.density;
            let dirY = (dy / distance) * force * this.density;
            this.x -= dirX;
            this.y -= dirY;
          }
        }

        draw() {
          ctx.fillStyle = `rgba(229, 176, 92, ${this.opacity})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.closePath();
          ctx.fill();
        }
      }

      function initParticles() {
        particles = [];
        const count = Math.floor((canvas.width * canvas.height) / 8000);
        for (let i = 0; i < count; i++) {
          particles.push(new Particle());
        }
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particles.length; i++) {
          particles[i].update();
          particles[i].draw();
        }
        animationFrameId = requestAnimationFrame(animate);
      }

      function handleMouseMove(e) {
        const rect = canvas.getBoundingClientRect();
        if (
          e.clientX >= rect.left &&
          e.clientX <= rect.right &&
          e.clientY >= rect.top &&
          e.clientY <= rect.bottom
        ) {
          mouse.x = e.clientX - rect.left;
          mouse.y = e.clientY - rect.top;
        } else {
          mouse.x = -1000;
          mouse.y = -1000;
        }
      }

      function handleMouseLeave() {
        mouse.x = -1000;
        mouse.y = -1000;
      }

      window.addEventListener('resize', resize);
      window.addEventListener('mousemove', handleMouseMove);
      window.addEventListener('mouseout', handleMouseLeave);

      resize();
      animate();
    })();
  </script>

  <script>
    (function () {
      const toggleBtn = document.getElementById('toggle-password');

      const eyeClosed = document.getElementById('eye-closed');

      if (toggleBtn && pwdInput) {
        toggleBtn.addEventListener('click', function () {
          if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            eyeOpen.style.display = 'none';
            eyeClosed.style.display = 'block';
          } else {
            pwdInput.type = 'password';
            eyeOpen.style.display = 'block';
            eyeClosed.style.display = 'none';
          }
        });
      }
    })();
  </script>

  <!-- ================================ -->
  <!--        LOGIN FORM HANDLER        -->
  <!-- ================================ -->
  <script>
    (function () {
      const form = document.getElementById('login_form');
      const btn = document.getElementById('login-btn');
      const btnText = document.getElementById('btn-text');
      const btnArrow = document.getElementById('btn-arrow');
      const btnSpinner = document.getElementById('btn-spinner');
      const msg = document.getElementById('login-message');
      const originalBtnText = btnText.innerText;

      function setMessage(type, text) {
        msg.style.display = 'block';
        msg.textContent = text;
        if (type === 'success') {
          msg.style.backgroundColor = 'rgba(16, 185, 129, 0.2)';
          msg.style.color = '#10b981';
          msg.style.border = '1px solid #10b981';
        } else {
          msg.style.backgroundColor = 'rgba(239, 68, 68, 0.2)';
          msg.style.color = '#ef4444';
          msg.style.border = '1px solid #ef4444';
        }
      }

      function clearMessage() {
        msg.style.display = 'none';
        msg.textContent = '';
      }

      function parseRedirect() {
        const params = new URLSearchParams(window.location.search);
        return params.get('redirect-to') || '/app';
      }

      function setLoading(loading) {
        btn.disabled = loading;
        if (loading) {
          btnText.innerText = 'Signing In...';
          btnArrow.style.display = 'none';
          btnSpinner.style.display = 'block';
        } else {
          btnText.innerText = originalBtnText;
          btnArrow.style.display = 'block';
          btnSpinner.style.display = 'none';
        }
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        clearMessage();
        setLoading(true);

        try {
          const fd = new FormData(form);
          const res = await fetch('/api/method/login', {
            method: 'POST',
            body: fd,
            headers: { 'Accept': 'application/json' }
          });

          const data = await res.json().catch(() => ({}));
          if (res.ok && data && data.message === 'Logged In') {
            setMessage('success', 'Login successful. Redirecting...');
            const target = parseRedirect();
            setTimeout(() => { window.location.href = target; }, 400);
          } else {
            let err = (data && (data.message || data.exc)) || 'Invalid credentials';
            if (typeof err === 'string' && err.startsWith('Traceback')) err = 'Login failed';
            setMessage('error', err);
            setLoading(false);
          }
        } catch (ex) {
          setMessage('error', 'Network error. Please try again.');
          setLoading(false);
        }
      });
    })();
  </script>
